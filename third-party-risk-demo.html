<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Third-Party Risk Intelligence</title>
<style>
/* Visual language taken from the team deck: Arial, black ink, #E60000 labels,
   warm grey panels, charcoal highlight blocks, thin grey rules. Light only, like the slides. */
:root {
  color-scheme: light;
  --bg: #ffffff; --ink: #000000; --ink-2: #333333; --muted: #6b6b6b; --faint: #7f7f7f;
  --rule: #bfbfbf; --hair: #e4e3dd; --red: #e60000; --red-dark: #c00000;
  --char: #5a5d5c; --warm: #ecebe4; --warm-2: #cccabc; --good: #2e7d32;
  --focus: #1f5fbf;
  --font: Arial, "Helvetica Neue", Helvetica, sans-serif;
}
*, *::before, *::after { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
h1, h2, h3, p { margin: 0; }
h1, h2, h3 { font-weight: 400; text-wrap: balance; }
a { color: var(--ink); }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }

/* app bar */
.appbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20; background: var(--bg); border-bottom: 1px solid var(--rule); }
.appbar-inner { max-width: 1400px; margin: 0 auto; padding-inline: 32px; min-height: 58px; display: flex; align-items: center; gap: 28px; flex-wrap: wrap; }
.brand { display: grid; line-height: 1.2; }
.brand-name { color: var(--red); font-weight: 700; font-size: 15px; }
.brand-sub { color: var(--muted); font-size: 12px; }
.nav { display: flex; align-self: stretch; gap: 4px; overflow-x: auto; }
.nav button { border: 0; background: none; padding: 0 14px; min-height: 58px; font-size: 14px; color: var(--ink-2); border-bottom: 3px solid transparent; display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.nav button:hover { color: var(--ink); }
.nav button[aria-current="page"] { color: var(--ink); font-weight: 700; border-bottom-color: var(--red); }
.count { font-size: 11px; font-weight: 700; min-width: 20px; padding: 1px 6px; border-radius: 10px; background: var(--warm); color: var(--ink); text-align: center; font-variant-numeric: tabular-nums; }
.nav button[aria-current="page"] .count { background: var(--red); color: #fff; }
#btn-reset { margin-left: auto; }

/* buttons */
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 6px; min-height: 36px; padding: 0 16px; border: 1px solid var(--ink); background: var(--bg); color: var(--ink); font-weight: 700; font-size: 13px; border-radius: 0; white-space: nowrap; }
.btn:hover { background: var(--warm); }
.btn-primary { background: var(--red); border-color: var(--red); color: #fff; }
.btn-primary:hover { background: var(--red-dark); border-color: var(--red-dark); }
.btn-dark { background: var(--char); border-color: var(--char); color: #fff; }
.btn-dark:hover { background: #454847; }
.btn[disabled] { opacity: .4; cursor: not-allowed; }
.btn-ghost { border-color: transparent; background: none; color: var(--ink-2); font-weight: 400; }
.btn-ghost:hover { background: var(--warm); }
.btn-sm { min-height: 30px; padding: 0 10px; font-size: 12.5px; }
.select, .input, .textarea { min-height: 36px; padding: 6px 10px; border: 1px solid var(--rule); background: var(--bg); border-radius: 0; font-size: 13px; }
.textarea { width: 100%; min-height: 60px; resize: vertical; }
input[type="checkbox"] { width: 18px; height: 18px; margin: 0; accent-color: var(--red); cursor: pointer; flex: none; }

/* layout */
.main { max-width: 1400px; margin: 0 auto; padding-inline: 32px; padding-block: 28px 72px; }
.title { display: flex; gap: 16px; align-items: stretch; margin-bottom: 22px; }
.title::before { content: ""; width: 5px; background: var(--red); flex: none; }
.title h1 { font-size: 30px; line-height: 1.15; }
.title p { color: var(--ink-2); margin-top: 6px; max-width: 80ch; }
.kicker { color: var(--red); font-weight: 700; font-size: 13px; margin-bottom: 4px; }
.label { color: var(--red); font-size: 15px; padding-bottom: 6px; border-bottom: 1px solid var(--rule); margin-bottom: 12px; display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }
.label small { color: var(--muted); font-size: 12px; }
.box { border: 1px solid var(--rule); background: var(--bg); min-width: 0; }
.panel { background: var(--warm); padding: 18px 20px; min-width: 0; }

/* pipeline strip (slide 4) */
.pipe { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 18px; margin-bottom: 26px; }
.step { border: 1px solid var(--rule); padding: 10px 12px 12px; position: relative; min-height: 104px; }
.step + .step::before { content: "›"; position: absolute; left: -14px; top: 38%; color: var(--faint); font-size: 16px; }
.step .n { font-size: 20px; color: var(--rule); font-weight: 700; line-height: 1; }
.step h3 { font-size: 13px; font-weight: 700; margin: 6px 0 4px; }
.step .v { font-size: 22px; font-weight: 700; line-height: 1.1; font-variant-numeric: tabular-nums; }
.step .d { font-size: 11.5px; color: var(--muted); margin-top: 2px; }
.step.on { background: var(--char); border-color: var(--char); color: #fff; }
.step.on .n, .step.on .d { color: #d8d8d4; }

/* KPIs */
.kpis { display: grid; grid-template-columns: 1.4fr repeat(3, minmax(0, 1fr)); gap: 18px; margin-bottom: 28px; }
.kpi { text-align: left; border: 1px solid var(--rule); background: var(--bg); padding: 16px 18px; display: grid; gap: 4px; align-content: start; }
button.kpi:hover { background: var(--warm); }
.kpi .k { font-size: 13px; color: var(--ink-2); }
.kpi .big { font-size: 40px; font-weight: 700; line-height: 1.05; }
.kpi .s { font-size: 12.5px; color: var(--muted); }
.kpi.hero { background: var(--red); border-color: var(--red); color: #fff; }
.kpi.hero .k, .kpi.hero .s { color: #fff; }
.kpi.hero .big { font-size: 52px; }
.kpi.hero:hover { background: var(--red-dark); }
.kpi .cta { font-weight: 700; font-size: 13px; margin-top: 6px; }

/* tier marks */
.tier { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; padding: 2px 7px; display: inline-block; line-height: 16px; white-space: nowrap; }
.tier-Critical { background: var(--red); color: #fff; }
.tier-High { background: var(--char); color: #fff; }
.tier-Medium { background: var(--warm-2); color: var(--ink); }
.tier-Low { background: var(--bg); color: var(--ink-2); box-shadow: inset 0 0 0 1px var(--rule); }
.score { width: 46px; height: 46px; border-radius: 50%; background: var(--warm); display: grid; place-content: center; text-align: center; flex: none; font-variant-numeric: tabular-nums; }
.score b { font-size: 15px; line-height: 1; }
.score i { font-style: normal; font-size: 9.5px; color: var(--muted); }
.score.Critical { box-shadow: inset 0 0 0 2px var(--red); }
.score.High { box-shadow: inset 0 0 0 2px var(--char); }
.score.lg { width: 84px; height: 84px; }
.score.lg b { font-size: 24px; }
.score.lg i { font-size: 11px; }
.prov { font-size: 11px; color: var(--muted); border: 1px dashed var(--rule); padding: 0 5px; white-space: nowrap; }
.prov.real { border-style: solid; }
.status { font-size: 12px; font-weight: 700; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
.status::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rule); }
.st-review { color: var(--red); } .st-review::before { background: var(--red); }
.st-todo::before { background: var(--char); }
.st-progress::before { background: var(--char); box-shadow: 0 0 0 2px var(--warm-2); }
.st-done { color: var(--good); } .st-done::before { background: var(--good); }
.st-watch { color: var(--muted); font-weight: 400; } .st-log { color: var(--muted); font-weight: 400; }

/* dashboard grid */
.dash { display: grid; grid-template-columns: minmax(0, 7fr) minmax(0, 5fr); gap: 28px; align-items: start; }
.side { display: grid; gap: 28px; min-width: 0; }
.alist { list-style: none; margin: 0; padding: 0; }
.arow { width: 100%; border: 0; border-bottom: 1px solid var(--hair); background: none; text-align: left; padding: 12px 8px; display: grid; grid-template-columns: 46px minmax(0, 1fr) auto; gap: 14px; align-items: center; }
.arow:hover { background: var(--warm); }
.arow.sel { background: var(--warm); box-shadow: inset 4px 0 0 var(--red); }
.arow .top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.arow .v { font-weight: 700; font-size: 14px; }
.arow .c { color: var(--muted); font-size: 13px; }
.arow .t { color: var(--ink-2); font-size: 13px; margin-top: 3px; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.arow .r { display: grid; justify-items: end; gap: 4px; font-size: 12px; color: var(--muted); text-align: right; }
.more { padding: 12px 0 0; }

/* routing bars */
.route { display: grid; gap: 10px; }
.route-row { display: grid; grid-template-columns: 168px minmax(0, 1fr) 34px; gap: 10px; align-items: center; font-size: 13px; }
.route-row .bar { display: flex; gap: 2px; height: 18px; }
.route-row .bar i { display: block; height: 100%; min-width: 3px; }
.seg-Critical { background: var(--red); } .seg-High { background: var(--char); } .seg-Medium { background: var(--warm-2); }
.route-row .n { text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; }
.legend { display: flex; gap: 14px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); margin-top: 12px; }
.legend span { display: inline-flex; align-items: center; gap: 6px; }
.legend i { width: 10px; height: 10px; display: inline-block; }
table.t { width: 100%; border-collapse: collapse; font-size: 12.5px; }
table.t th { text-align: left; font-weight: 400; font-style: italic; color: var(--faint); font-size: 11.5px; padding: 6px 8px; border: 1px solid var(--ink); }
table.t td { padding: 7px 8px; border: 1px solid var(--ink); vertical-align: top; }
table.t td.n, table.t th.n { text-align: right; font-variant-numeric: tabular-nums; }
table.t tr.link { cursor: pointer; } table.t tr.link:hover td { background: var(--warm); }
.tip { position: fixed; z-index: 50; pointer-events: none; background: var(--bg); border: 1px solid var(--ink); padding: 6px 9px; font-size: 12px; }

/* review queue */
.queue { display: grid; grid-template-columns: minmax(340px, 5fr) minmax(0, 7fr); gap: 28px; align-items: start; }
.qhead { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.seg { display: inline-flex; border: 1px solid var(--ink); }
.seg button { border: 0; background: none; padding: 6px 12px; font-size: 12.5px; }
.seg button + button { border-left: 1px solid var(--ink); }
.seg button[aria-pressed="true"] { background: var(--ink); color: #fff; font-weight: 700; }
.qlist { max-height: calc(100vh - 230px); overflow-y: auto; border-top: 1px solid var(--rule); }
.card { position: sticky; top: 78px; border: 1px solid var(--rule); padding: 22px 24px 24px; display: grid; gap: 20px; max-height: calc(100vh - 100px); overflow-y: auto; }
.card-top { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 16px; align-items: start; }
.card-top .tl { color: var(--red); font-weight: 700; font-size: 13px; letter-spacing: .04em; }
.card-top .tl.High, .card-top .tl.Medium, .card-top .tl.Low { color: var(--ink); }
.card-top h2 { font-size: 24px; line-height: 1.2; margin-top: 2px; }
.owner-line { font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 22px; padding-bottom: 14px; border-bottom: 1px solid var(--rule); }
.owner-line b { font-weight: 700; }
.quote { background: var(--warm); padding: 12px 14px; font-size: 14.5px; }
.cols { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 24px; }
.h { font-weight: 700; font-size: 13px; margin-bottom: 6px; }
.why { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; color: var(--ink-2); }
.acts { margin: 0; padding-left: 18px; font-size: 13px; display: grid; gap: 4px; }
.formula { background: var(--warm); padding: 12px 14px; display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 10px; font-size: 13px; }
.formula b { font-size: 17px; font-variant-numeric: tabular-nums; }
.formula .eq { font-weight: 700; }
.facts { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px 18px; font-size: 12.5px; margin-top: 10px; }
.facts dt { color: var(--muted); font-size: 11.5px; }
.facts dd { margin: 0; font-weight: 700; }
.ev td:first-child { white-space: nowrap; color: var(--faint); }
.ev td:nth-child(2) { white-space: nowrap; }
.pos { font-size: 12px; font-weight: 700; color: var(--good); }
.hitl { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; }
.hitl .select { min-width: 220px; }
.hitl .note { font-size: 12px; color: var(--muted); flex-basis: 100%; }
.done-box { background: var(--warm); padding: 14px 16px; display: grid; gap: 8px; }
.empty { padding: 40px 20px; text-align: center; color: var(--muted); display: grid; gap: 10px; justify-items: center; }

/* team board */
.teams { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 18px; }
.teams button { border: 1px solid var(--rule); background: var(--bg); padding: 7px 12px; font-size: 13px; display: inline-flex; gap: 8px; align-items: center; }
.teams button:hover { background: var(--warm); }
.teams button[aria-pressed="true"] { background: var(--char); color: #fff; border-color: var(--char); font-weight: 700; }
.teams button[aria-pressed="true"] .count { background: #fff; color: var(--ink); }
.board { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 18px; align-items: start; }
.col { background: var(--warm); padding: 12px; min-width: 0; min-height: 220px; }
.col h2 { font-size: 15px; color: var(--red); display: flex; justify-content: space-between; margin-bottom: 10px; }
.col h2 span { color: var(--ink); font-weight: 700; }
.col-body { display: grid; gap: 10px; }
.tc { border: 1px solid var(--rule); background: var(--bg); text-align: left; padding: 12px; display: grid; gap: 7px; width: 100%; }
.tc:hover { border-color: var(--ink); }
.tc .top { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.tc .id { font-size: 12px; color: var(--muted); }
.tc .v { font-weight: 700; }
.tc .p { font-size: 12.5px; color: var(--ink-2); }
.prog { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; align-items: center; font-size: 12px; color: var(--muted); }
.prog .tr { height: 6px; background: var(--warm); }
.prog .tr i { display: block; height: 100%; background: var(--char); }
.prog.full .tr i { background: var(--good); }
.due { font-size: 12px; }
.due.over { color: var(--red); font-weight: 700; }
.col-empty { font-size: 12.5px; color: var(--muted); padding: 18px 8px; text-align: center; border: 1px dashed var(--warm-2); background: var(--bg); }

/* drawer */
.backdrop { position: fixed; inset: 0; background: rgba(0, 0, 0, .35); z-index: 40; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(600px, 100%); background: var(--bg); z-index: 41; overflow-y: auto; padding: 22px 26px 30px; display: grid; gap: 18px; align-content: start; box-shadow: -8px 0 24px rgba(0, 0, 0, .15); }
.drawer .x { justify-self: end; }
.checks { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.checks label { display: grid; grid-template-columns: 20px minmax(0, 1fr); gap: 10px; padding: 10px 12px; border: 1px solid var(--rule); cursor: pointer; font-size: 13.5px; align-items: start; }
.checks label:hover { background: var(--warm); }
.checks label.ok { background: var(--warm); }
.checks label.ok .ct { text-decoration: line-through; color: var(--muted); }
.checks .cm { display: block; font-size: 11.5px; color: var(--muted); }
.addrow { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 8px; }
.log { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; font-size: 12.5px; color: var(--ink-2); }
.log time { color: var(--muted); margin-right: 8px; font-variant-numeric: tabular-nums; }

/* toast */
.toast { position: fixed; left: 50%; bottom: 24px; transform: translateX(-50%); z-index: 60; background: var(--ink); color: #fff; padding: 11px 12px 11px 18px; display: flex; gap: 14px; align-items: center; font-size: 13.5px; max-width: calc(100% - 32px); }
.toast button { border: 1px solid #fff; background: none; color: #fff; padding: 5px 10px; font-weight: 700; font-size: 12.5px; white-space: nowrap; }

@media (max-width: 1100px) {
  .pipe { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .step:nth-child(4)::before { display: none; }
  .kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .dash, .queue { grid-template-columns: minmax(0, 1fr); }
  .card { position: static; max-height: none; }
  .qlist { max-height: 420px; }
  .board { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 640px) {
  .appbar-inner, .main { padding-inline: 16px; }
  .appbar-inner { gap: 4px 12px; padding-top: 8px; }
  .nav { order: 3; width: 100%; }
  .nav button { min-height: 44px; }
  .pipe { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .step::before { display: none; }
  .cols, .facts { grid-template-columns: minmax(0, 1fr); }
  .route-row { grid-template-columns: 120px minmax(0, 1fr) 30px; }
  .arow { grid-template-columns: 46px minmax(0, 1fr); }
  .arow .r { grid-column: 2; justify-items: start; text-align: left; }
  .title h1 { font-size: 24px; }
  .drawer { padding-inline: 16px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

.title { flex-wrap: wrap; }
.run { margin-left: auto; display: grid; gap: 6px; justify-items: end; align-self: center; }
.run-btn { min-height: 44px; padding: 0 22px; font-size: 14px; }
.run-note { font-size: 12px; color: var(--muted); }
.step.running { animation: pulse 1s ease-in-out infinite; }
@keyframes pulse { 50% { background: #6f7271; } }
.panel.idle { display: grid; gap: 12px; justify-items: start; padding: 22px 24px; }
.panel.idle p { color: var(--ink-2); }
.scanbar { width: min(420px, 100%); height: 6px; background: #fff; }
.scanbar i { display: block; height: 100%; background: var(--red); transition: width .5s; }
@media (max-width: 640px) { .run { margin-left: 21px; justify-items: start; } }

</style>
</head>
<body>
<header class="appbar">
  <div class="appbar-inner">
    <div class="brand">
      <span class="brand-name">Third-Party Risk Intelligence</span>
      <span class="brand-sub">Vendor risk monitor · demo on synthetic data</span>

    <nav class="nav" id="nav" aria-label="Main"></nav>
    <button type="button" class="btn btn-ghost btn-sm" data-act="reset" id="btn-reset">Reset demo</button>
  </div>
</header>
<main class="main" id="main"></main>
<div id="overlay"></div>

<script>
/* Third-Party Risk Intelligence — demo rules (pure functions, no DOM).
   Scores and tiers come from the pipeline (scored_signals.csv); this file only
   routes them (category -> owner team, tier -> deadline) and drafts actions. */
(function (root) {
  'use strict';

  // Slide 8: the tier decides how fast
  const TIERS = [
    { id: 'Critical', min: 16, hours: 24, deadline: '24 h', response: 'Escalate, open incident, human review before vendor contact' },
    { id: 'High', min: 10, hours: 72, deadline: '72 h', response: 'Notify owner team, request vendor statement' },
    { id: 'Medium', min: 5, hours: 24 * 14, deadline: '14 days', response: 'Add to watchlist, check at next monitoring cycle' },
    { id: 'Low', min: 0, hours: 0, deadline: '–', response: 'Log only, review at scheduled reassessment' }
  ];
  const TIER_BY_ID = Object.fromEntries(TIERS.map(t => [t.id, t]));
  const TIER_RANK = { Critical: 0, High: 1, Medium: 2, Low: 3 };

  // Slide 8: the category decides who acts (Concentration and Conduct added for this data)
  const TEAMS = [
    { id: 'sec', name: 'Security & IT', unit: 'Cyber Incident Response', cats: ['CYBER'] },
    { id: 'privacy', name: 'Data Privacy Office', unit: 'Privacy incidents', cats: [] },
    { id: 'audit', name: 'Audit & Compliance', unit: 'Regulatory & contract controls', cats: ['COMPLIANCE'] },
    { id: 'proc', name: 'Procurement & Vendor Mgmt', unit: 'Sourcing, exit & financial health', cats: ['FINANCIAL', 'CONCENTRATION'] },
    { id: 'bcm', name: 'Business Continuity', unit: 'Outages, DR & service levels', cats: ['OPERATIONAL'] },
    { id: 'risk', name: 'Risk Management', unit: 'Reputational & conduct risk', cats: ['CONDUCT', 'OTHER'] }
  ];
  const TEAM_BY_ID = Object.fromEntries(TEAMS.map(t => [t.id, t]));
  const CATEGORY_LABEL = { CYBER: 'Cyber', OPERATIONAL: 'Operational', COMPLIANCE: 'Compliance', CONCENTRATION: 'Concentration', CONDUCT: 'Conduct', FINANCIAL: 'Financial', OTHER: 'Other' };
  const SOURCE_LABEL = { audit_finding: 'Audit finding', vendor_questionnaire: 'Vendor questionnaire', news_article: 'News article', regulatory_filing: 'Regulatory filing', incident_ticket: 'Incident ticket', market_data: 'Market data' };
  const LINK_LABEL = { CONFIRMED: 'Confirmed', REPORTED: 'Reported', INDUSTRY: 'Industry only' };

  function teamFor(category) {
    const t = TEAMS.find(x => x.cats.includes(category));
    return t ? t.id : 'risk';
  }

  // Recommended actions: tier response first, then an issue-specific playbook (first match wins)
  const PLAYBOOKS = [
    { test: /\b(terminat|cancel+ed|insourc)/i, label: 'Contract exit / migration', actions: ['Confirm exit timeline and migration milestones with the service owner', 'Secure data return and deletion certificates', 'Monitor service continuity during the transition'] },
    { test: /access recertification|dormant privileged/i, label: 'Privileged access overdue', actions: ['Have the vendor disable dormant privileged accounts within 24 h', 'Obtain completed access recertification evidence', 'Log the finding with an owner and target date'] },
    { test: /\bmfa\b|multi-factor/i, label: 'MFA gap on admin accounts', actions: ['Require MFA on all administrator accounts, with a date', 'Confirm compensating controls until enforced', 'Re-test the control after remediation'] },
    { test: /unpatched|end-of-life/i, label: 'Unpatched end-of-life systems', actions: ['Obtain the list of affected internet-facing hosts', 'Require a patch or decommission plan with dates', "Request the vendor's latest vulnerability scan"] },
    { test: /phishing simulation/i, label: 'Phishing click rate above threshold', actions: ["Request the vendor's awareness remediation plan", 'Confirm re-training for staff on the bank engagement', 'Agree a follow-up simulation and pass threshold'] },
    { test: /disaster recovery|failover/i, label: 'Disaster recovery not proven', actions: ['Obtain the root cause of the failed failover test', 'Schedule a witnessed DR re-test', 'Check impact tolerance of the dependent service'] },
    { test: /key-person|single named individual/i, label: 'Key-person dependency', actions: ['Request a backup-coverage and succession plan', 'Require runbooks and knowledge transfer', 'Review at the next service meeting'] },
    { test: /lock-in|switching cost|proprietary data format/i, label: 'Vendor lock-in', actions: ['Review exit and data-portability clauses', 'Request a data export in an open format', 'Update the exit plan with cost and duration'] },
    { test: /sole source|no viable alternative/i, label: 'Sole-source provider', actions: ['Validate the substitutability assessment', 'Run a market scan for alternative providers', 'Update and test the stressed exit plan'] },
    { test: /single data cent(re|er)|geographic concentration/i, label: 'Single data centre', actions: ["Request the vendor's secondary-site roadmap", 'Assess a regional-outage scenario', 'Record the concentration in the risk register'] },
    { test: /sub-?contract|fourth-party/i, label: 'Fourth-party dependency', actions: ['Obtain the subcontractor inventory for core delivery', 'Confirm notification and approval rights in the contract', "Request due diligence on the fourth party's resilience"] },
    { test: /data-residency|data residency/i, label: 'Data residency not evidenced', actions: ['Request evidence of the agreed data-residency controls', 'Confirm storage and processing locations', 'Involve Data Privacy if data left agreed jurisdictions'] },
    { test: /attestation/i, label: 'Attestation outstanding', actions: ['Chase the vendor for the annual attestation', 'Set a final deadline and inform the relationship owner'] },
    { test: /delivery delay|milestone|delayed/i, label: 'Delivery delay', actions: ['Obtain root cause and a re-baselined plan', 'Assess impact on dependent programmes', 'Check contractual remedies (service credits)'] },
    { test: /degraded performance|backlog/i, label: 'Degraded service / backlog', actions: ["Request the vendor's capacity-recovery plan", 'Track the backlog daily until cleared', 'Identify processes that depend on batch completion'] },
    { test: /outage|\bSLA\b|downtime|update failure|crash|resilience/i, label: 'Outage / SLA breach', actions: ['Request a root-cause analysis within 5 business days', 'Calculate service credits due under the contract', 'Review the service against its impact tolerance'] },
    { test: /ransomware|breach|attack|compromis|exfiltrat|leak|backdoor|sunburst|zero-day|intrusion|hack|malicious|stolen|vulnerab|patch/i, cat: 'CYBER', label: 'Vendor cyber incident', actions: ["Check the vendor's access to bank systems; consider temporary restriction", 'Request incident details and remediation timeline', 'Verify exposed credentials and indicators of compromise'] },
    { test: /fine|penalt|settlement|\bSEC\b|complaint|charged|enforcement|\bICO\b|\bFCA\b|\bFTC\b|class action|funds|audit/i, cat: 'COMPLIANCE', label: 'Regulatory action', actions: ['Assess whether the findings affect services to the bank', "Request the vendor's remediation plan", "Update the vendor's due-diligence file"] },
    { test: /./, cat: 'FINANCIAL', label: 'Financial deterioration', actions: ['Review financials, credit rating and market indicators', 'Check exposure: prepayments, escrow, data return', 'Confirm exit-plan readiness'] },
    { test: /./, cat: 'CONDUCT', label: 'Misconduct / governance', actions: ['Assess reputational exposure for the bank', 'Legal review of termination-for-cause rights', 'Brief the relationship owner'] },
    { test: /./, cat: 'CONCENTRATION', label: 'Rising concentration', actions: ['Map services that depend on this provider', 'Update the concentration register', 'Confirm the exit plan covers the scope'] }
  ];
  const TIER_ACTION = {
    Critical: 'Open an incident and escalate to the team lead',
    High: 'Request a written statement from the vendor',
    Medium: 'Add the vendor to the watchlist',
    Low: 'Log for the scheduled reassessment'
  };

  function playbookFor(a) {
    for (const pb of PLAYBOOKS) {
      if (pb.cat && pb.cat !== a.category) continue;
      if (pb.test.test(a.text)) return pb;
    }
    return { label: (CATEGORY_LABEL[a.category] || 'Other') + ' risk signal', actions: ['Assess relevance to the bank', "Request the vendor's evidence", 'Record the outcome'] };
  }
  function actionsFor(a) {
    const pb = playbookFor(a);
    const n = a.tier === 'Medium' ? 2 : a.tier === 'Low' ? 1 : 3;
    const list = [TIER_ACTION[a.tier], ...pb.actions.slice(0, n)];
    if (a.tier === 'Critical') list.push('Complete human review before any vendor contact');
    return list;
  }

  /** Split the pipeline's explanation on "; " but not inside parentheses. */
  function splitExplanation(s) {
    const parts = []; let depth = 0, cur = '';
    for (let i = 0; i < s.length; i++) {
      const ch = s[i];
      if (ch === '(') depth++;
      if (ch === ')') depth = Math.max(0, depth - 1);
      if (depth === 0 && ch === ';' && s[i + 1] === ' ') { parts.push(cur.trim()); cur = ''; i++; continue; }
      cur += ch;
    }
    if (cur.trim()) parts.push(cur.trim());
    return parts;
  }

  const num = v => { const n = parseFloat(v); return isNaN(n) ? 0 : n; };
  const bool = v => String(v).toLowerCase() === 'true';

  /** Normalise one scored_signals.csv row. */
  function fromCsv(r) {
    const a = {
      id: r.signal_id, vendorId: r.vendor_id, vendor: r.vendor_name, date: String(r.date).slice(0, 10),
      sourceType: r.source_type, sourceName: r.source_name, url: /^https?:\/\//i.test(r.url || '') ? r.url : '',
      text: r.text, provenance: r.provenance, category: r.risk_category, sentiment: r.sentiment, maturity: r.maturity,
      confidence: num(r.classifier_confidence), reason: r.classifier_reason,
      service: r.service, country: r.country, ubsLink: r.ubs_link, relationship: r.relationship_note,
      dataSensitivity: num(r.data_sensitivity), criticality: num(r.business_criticality), substitutability: num(r.substitutability),
      credibility: num(r.credibility), freshness: num(r.freshness), nSources: num(r.n_sources),
      likelihood: num(r.likelihood), impact: num(r.impact), inherent: num(r.inherent_risk),
      controlReduction: num(r.control_reduction), nPositive: num(r.n_positive), residual: num(r.residual_risk),
      tier: TIER_BY_ID[r.tier] ? r.tier : 'Low', review: bool(r.needs_human_review), explanation: r.explanation || ''
    };
    a.why = splitExplanation(a.explanation).slice(1);
    a.team = teamFor(a.category);
    a.playbook = playbookFor(a).label;
    a.actions = actionsFor(a);
    return a;
  }

  const VRM = { TIERS, TIER_BY_ID, TIER_RANK, TEAMS, TEAM_BY_ID, CATEGORY_LABEL, SOURCE_LABEL, LINK_LABEL, teamFor, playbookFor, actionsFor, splitExplanation, fromCsv };
  if (typeof module !== 'undefined' && module.exports) module.exports = VRM; else root.VRM = VRM;
})(typeof window !== 'undefined' ? window : globalThis);

</script>
<script>
(function () {
'use strict';
// ===== Utilities =====
const V = window.VRM;
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const plural = (n, w, pw) => `${n} ${n === 1 ? w : (pw || w + 's')}`;
const dayMs = s => { const [y, m, d] = String(s).split('-').map(Number); return Date.UTC(y, m - 1, d); };
const fmtD = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', year: 'numeric', timeZone: 'UTC' });
const fmtLong = new Intl.DateTimeFormat('en-GB', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric', timeZone: 'UTC' });
const fmtTime = new Intl.DateTimeFormat('en-GB', { hour: '2-digit', minute: '2-digit' });
const fmtStamp = new Intl.DateTimeFormat('en-GB', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' });
const fd = s => fmtD.format(dayMs(s));
const cat = c => V.CATEGORY_LABEL[c] || c;
const src = s => V.SOURCE_LABEL[s] || s;
const teamName = id => V.TEAM_BY_ID[id].name;

// ===== Data =====
const SEED = JSON.parse(document.getElementById('seed-data').textContent);
const META = SEED.meta;
const ALERTS = SEED.alerts.map(V.fromCsv).sort((a, b) => b.residual - a.residual);
const BY_ID = new Map(ALERTS.map(a => [a.id, a]));
const CONTEXT = SEED.context;

// ===== State =====
const S = {
  view: 'dashboard', scope: 'review', sel: null, teamPick: {}, team: 'sec', caseId: null,
  cases: [], byAlert: new Map(), seq: 0, toast: null, newAction: '',
  run: 'idle', runStep: 0, lastRun: 0, runMs: 0
};

// Stage of an alert in the demo workflow
function stageOf(a) {
  const c = S.byAlert.get(a.id);
  if (c) return c.finishedAt ? 'done' : c.actions.some(x => x.done) ? 'progress' : 'todo';
  if (a.review) return 'review';
  return a.tier === 'Medium' ? 'watch' : 'log';
}
const STAGE = { review: 'Awaiting review', watch: 'Watchlist', log: 'Logged', todo: 'With team', progress: 'In progress', done: 'Finished' };
const stagePill = st => `<span class="status st-${st}">${STAGE[st]}</span>`;
const tierMark = t => `<span class="tier tier-${t}">${t}</span>`;
const scoreBadge = (a, lg) => `<span class="score ${a.tier}${lg ? ' lg' : ''}"><b>${a.residual.toFixed(1)}</b><i>/ 25</i></span>`;
const provMark = a => a.provenance === 'REAL'
  ? '<span class="prov real" title="Public source">Public source</span>'
  : '<span class="prov" title="Synthetic demo record, not a real finding">Illustrative</span>';

function dueText(c) {
  if (c.finishedAt) return { text: 'Finished ' + fmtStamp.format(c.finishedAt), over: false };
  if (!c.due) return { text: 'No deadline (log only)', over: false };
  const h = Math.round((c.due - Date.now()) / 3600000);
  if (h < 0) return { text: `Overdue by ${plural(-h, 'hour')}`, over: true };
  if (h < 48) return { text: `Due in ${plural(h, 'hour')}`, over: false };
  return { text: `Due in ${plural(Math.round(h / 24), 'day')}`, over: false };
}

// ===== Workflow =====
function distribute(a, teamId) {
  S.seq += 1;
  const now = Date.now();
  const hours = V.TIER_BY_ID[a.tier].hours;
  const c = {
    id: 'TPR-' + String(S.seq).padStart(3, '0'), alertId: a.id, team: teamId, createdAt: now,
    due: hours ? now + hours * 3600000 : 0, finishedAt: 0, outcome: '',
    actions: a.actions.map(t => ({ text: t, done: false, at: 0 })),
    log: [{ at: now, text: `Reviewed by TPRM analyst and sent to ${teamName(teamId)}` + (teamId !== a.team ? ` (suggested: ${teamName(a.team)})` : '') }]
  };
  S.cases.push(c); S.byAlert.set(a.id, c);
  return c;
}
function toggleAction(c, i) {
  const x = c.actions[i]; x.done = !x.done; x.at = x.done ? Date.now() : 0;
  c.log.push({ at: Date.now(), text: (x.done ? 'Done: ' : 'Reopened: ') + x.text });
}
function finishCase(c, outcome) {
  c.finishedAt = Date.now(); c.outcome = outcome;
  c.log.push({ at: c.finishedAt, text: 'Marked finished · ' + outcome });
}
function resetDemo() {
  S.cases = []; S.byAlert = new Map(); S.seq = 0; S.sel = null; S.caseId = null; S.teamPick = {}; S.scope = 'review'; S.team = 'sec';
  S.run = 'idle'; S.runStep = 0; S.lastRun = 0;
}
function evidenceFor(a) {
  // same vendor + category, up to a year before the alert (what corroboration counts)
  const from = dayMs(a.date) - 365 * 86400000;
  return ALERTS.filter(o => o.vendorId === a.vendorId && o.category === a.category && dayMs(o.date) <= dayMs(a.date) && dayMs(o.date) >= from)
    .sort((x, y) => (x.id === a.id ? -1 : y.id === a.id ? 1 : dayMs(y.date) - dayMs(x.date))).slice(0, 4);
}
function positivesFor(a) {
  return CONTEXT.filter(s => s.vendorId === a.vendorId && s.sentiment === 'positive').sort((x, y) => dayMs(y.date) - dayMs(x.date)).slice(0, 3);
}

// ===== Views =====
function renderNav() {
  const nReview = S.run === 'done' ? ALERTS.filter(a => stageOf(a) === 'review').length : null;
  const nOpen = S.cases.filter(c => !c.finishedAt).length;
  const items = [['dashboard', 'Daily dashboard', null], ['queue', 'Review queue', nReview], ['team', 'Team workspace', nOpen]];
  $('#nav').innerHTML = items.map(([v, l, n]) =>
    `<button type="button" data-act="nav" data-view="${v}"${S.view === v ? ' aria-current="page"' : ''}>${l}${n != null ? ` <span class="count">${n}</span>` : ''}</button>`).join('');
}

function alertRow(a, opts) {
  const st = stageOf(a);
  const c = S.byAlert.get(a.id);
  return `<li><button type="button" class="arow${S.sel === a.id && opts && opts.sel ? ' sel' : ''}" data-act="open-alert" data-id="${a.id}">
    ${scoreBadge(a)}
    <span><span class="top">${tierMark(a.tier)}<span class="v">${esc(a.vendor)}</span><span class="c">· ${cat(a.category)}</span></span>
    <span class="t">${esc(a.text)}</span></span>
    <span class="r">${stagePill(st)}<span>${c ? esc(teamName(c.team)) : esc(teamName(a.team))}</span><span>${a.tier === 'Low' ? 'Log only' : V.TIER_BY_ID[a.tier].deadline}</span></span>
  </button></li>`;
}

function viewDashboard() {
  const tiers = ALERTS.reduce((m, a) => (m[a.tier] = (m[a.tier] || 0) + 1, m), {});
  const review = ALERTS.filter(a => stageOf(a) === 'review');
  const open = S.cases.filter(c => !c.finishedAt);
  const done = S.cases.filter(c => c.finishedAt);
  const inProg = open.filter(c => c.actions.some(x => x.done)).length;
  const median = ALERTS.map(a => a.residual).sort((x, y) => x - y)[Math.floor(ALERTS.length / 2)];
  const top = ALERTS.filter(a => a.tier === 'Critical' || a.tier === 'High').slice(0, 8);

  const steps = [
    ['Collect', META.collected, `signals on ${META.vendors} vendors`],
    ['Normalise', META.collected, 'matched to vendor profiles'],
    ['Classify', META.risk, `risk · ${META.positive} positive · ${META.neutral} neutral`],
    ['Score', ALERTS.length, `L × I × (1 − controls), median ${median.toFixed(1)}`],
    ['Tier & route', (tiers.Critical || 0) + (tiers.High || 0), `Critical + High · ${tiers.Medium || 0} Medium · ${tiers.Low || 0} Low`],
    ['Show', review.length, 'waiting for a person']
  ];
  const LOG = ['Pulling news, advisories, filings and tickets', 'Cleaning text and dates, matching vendor names', 'LLM classifier: category, sentiment, confidence', 'Likelihood × Impact, reduced by vendor controls', 'Assigning tier, owner team and deadline', 'Publishing alerts to the review queue'];
  const pipe = steps.map(([h, v, d], i) => {
    const doneStep = S.run === 'done' || (S.run === 'running' && i < S.runStep);
    const active = S.run === 'running' && i === S.runStep;
    const cls = active ? ' on running' : S.run === 'done' && (i === 3 || i === 4) ? ' on' : '';
    return `<div class="step${cls}"><div class="n">${i + 1}</div><h3>${h}</h3><div class="v">${doneStep ? v : active ? '…' : '–'}</div><div class="d">${esc(doneStep ? d : active ? LOG[i] : 'waiting')}</div></div>`;
  }).join('');
  const runBtn = `<div class="run">
    <button type="button" class="btn btn-primary run-btn" data-act="run" ${S.run === 'running' ? 'disabled' : ''}>${S.run === 'running' ? `Scanning… step ${S.runStep + 1} of 6` : S.run === 'done' ? 'Run news scan again' : 'Run news scan'}</button>
    <span class="run-note">${S.run === 'done' ? `Last scan ${fmtTime.format(S.lastRun)} · ${META.collected} signals · ${(S.runMs / 1000).toFixed(1)} s` : 'Collects and scores today’s news for all monitored vendors'}</span></div>`;
  const head = `<div class="title"><div><div class="kicker">Daily alert briefing</div><h1>${fmtLong.format(dayMs(META.runDate))}</h1>
    <p>${S.run === 'done' ? `Today's run scored ${ALERTS.length} risk signals across ${META.vendors} vendors. Every High or Critical alert waits for a person before anyone contacts a vendor.` : S.run === 'running' ? `Scanning public news, advisories and internal records on ${META.vendors} vendors…` : `No scan yet today. Run the news scan to collect, classify and score new signals on ${META.vendors} vendors.`}</p></div>${runBtn}</div>`;
  if (S.run !== 'done') {
    return `${head}<div class="pipe" aria-label="Pipeline run" aria-live="polite">${pipe}</div>
    <div class="panel idle"><div class="label" style="margin-bottom:8px">Today's alerts</div>
      <p>${S.run === 'running' ? 'Scanning sources… alerts appear here when scoring finishes.' : 'Nothing scored yet. Start the scan to see today’s alerts, owner teams and deadlines.'}</p>
      ${S.run === 'running' ? `<div class="scanbar"><i style="width:${((S.runStep + 0.5) / 6) * 100}%"></i></div>` : '<button type="button" class="btn btn-primary" data-act="run">Run news scan</button>'}</div>`;
  }

  // routing: open work per owner team, stacked by tier (Low is log-only)
  const rows = V.TEAMS.map(t => {
    const list = ALERTS.filter(a => (S.byAlert.get(a.id) ? S.byAlert.get(a.id).team : a.team) === t.id && a.tier !== 'Low');
    const by = { Critical: 0, High: 0, Medium: 0 };
    list.forEach(a => by[a.tier]++);
    return { t, by, n: list.length };
  });
  const max = Math.max(1, ...rows.map(r => r.n));
  const route = rows.map(({ t, by, n }) => `<div class="route-row"><span>${esc(t.name)}</span><span class="bar" role="img" aria-label="${esc(t.name)}: ${by.Critical} Critical, ${by.High} High, ${by.Medium} Medium">${
    ['Critical', 'High', 'Medium'].filter(k => by[k]).map(k => `<i class="seg-${k}" style="width:${(by[k] / max) * 100}%" data-tip="${esc(t.name)} · ${k}: ${by[k]}"></i>`).join('')}</span><span class="n">${n}</span></div>`).join('');

  // vendor risk summary
  const vendors = [...new Set(ALERTS.map(a => a.vendorId))].map(id => {
    const list = ALERTS.filter(a => a.vendorId === id);
    const worst = list[0]; // ALERTS sorted by residual desc
    return { id, name: worst.vendor, service: worst.service, link: worst.ubsLink, n: list.length, worst };
  }).sort((x, y) => y.worst.residual - x.worst.residual).slice(0, 8);

  return `${head}
  <div class="pipe" aria-label="Today's pipeline run">${pipe}</div>
  <div class="kpis">
    <button type="button" class="kpi hero" data-act="nav" data-view="queue"><span class="k">Awaiting human review</span><span class="big">${review.length}</span>
      <span class="s">${review.filter(a => a.tier === 'Critical').length} Critical · ${review.filter(a => a.tier === 'High').length} High</span><span class="cta">Open review queue ›</span></button>
    <button type="button" class="kpi" data-act="nav" data-view="team"><span class="k">With owner teams</span><span class="big">${open.length}</span><span class="s">${inProg} in progress</span></button>
    <button type="button" class="kpi" data-act="nav" data-view="team"><span class="k">Finished</span><span class="big">${done.length}</span><span class="s">closed with an outcome</span></button>
    <div class="kpi"><span class="k">Watchlist · log only</span><span class="big">${(tiers.Medium || 0)} <span style="font-size:22px">· ${(tiers.Low || 0)}</span></span><span class="s">Medium re-checked in 14 days · Low logged</span></div>
  </div>
  <div class="dash">
    <section><div class="label">Today's top alerts <small>ranked by residual risk</small></div>
      <ul class="alist">${top.map(a => alertRow(a)).join('')}</ul>
      <div class="more"><button type="button" class="btn" data-act="nav" data-view="queue">See all ${review.length} in the review queue ›</button></div></section>
    <div class="side">
      <section><div class="label">Who acts <small>open alerts by owner team</small></div>
        <div class="route">${route}</div>
        <div class="legend"><span><i class="seg-Critical"></i>Critical · 24 h</span><span><i class="seg-High"></i>High · 72 h</span><span><i class="seg-Medium"></i>Medium · 14 days</span></div></section>
      <section><div class="label">Vendor risk summary <small>highest score per vendor</small></div>
        <table class="t"><thead><tr><th>Vendor</th><th>UBS link</th><th class="n">Alerts</th><th>Top alert</th></tr></thead><tbody>
        ${vendors.map(v => `<tr class="link" data-act="open-alert" data-id="${v.worst.id}"><td><b>${esc(v.name)}</b><br><span class="muted">${esc(v.service)}</span></td><td>${esc(V.LINK_LABEL[v.link] || v.link)}</td><td class="n">${v.n}</td><td>${tierMark(v.worst.tier)} <span class="num">${v.worst.residual.toFixed(1)}</span></td></tr>`).join('')}
        </tbody></table></section>
    </div>
  </div>`;
}

function viewQueue() {
  if (S.run !== 'done') return `<div class="title"><div><div class="kicker">Review queue</div><h1>No alerts yet</h1><p>Run today's news scan on the dashboard first.</p></div></div>
    <button type="button" class="btn btn-primary" data-act="run-from-queue">Go to dashboard and run the scan</button>`;
  const list = ALERTS.filter(a => S.scope === 'all' || stageOf(a) === 'review');
  if (!S.sel || !BY_ID.has(S.sel)) S.sel = list[0] ? list[0].id : null;
  const a = S.sel && BY_ID.get(S.sel);
  return `
  <div class="title"><div><div class="kicker">Review queue</div><h1>Every alert carries an owner, a deadline and its evidence</h1>
    <p>Check why the alert was flagged, confirm the owner team, and send it. Nothing goes to a vendor automatically.</p></div></div>
  <div class="queue">
    <section>
      <div class="qhead"><div class="seg" role="group" aria-label="Show">
        <button type="button" data-act="scope" data-scope="review" aria-pressed="${S.scope === 'review'}">Awaiting review (${ALERTS.filter(x => stageOf(x) === 'review').length})</button>
        <button type="button" data-act="scope" data-scope="all" aria-pressed="${S.scope === 'all'}">All alerts (${ALERTS.length})</button></div></div>
      <div class="qlist" id="qlist">${list.length ? `<ul class="alist">${list.map(x => alertRow(x, { sel: true })).join('')}</ul>` :
        `<div class="empty"><b>Queue clear</b><span>All High and Critical alerts are with their owner teams.</span><button type="button" class="btn" data-act="nav" data-view="team">Go to team workspace ›</button></div>`}</div>
    </section>
    ${a ? alertCard(a) : '<div class="card"><div class="empty">Select an alert.</div></div>'}
  </div>`;
}

function alertCard(a) {
  const tier = V.TIER_BY_ID[a.tier];
  const st = stageOf(a);
  const c = S.byAlert.get(a.id);
  const pick = S.teamPick[a.id] || a.team;
  const ev = evidenceFor(a);
  const pos = a.nPositive ? positivesFor(a) : [];
  const why = a.why.map(w => w.replace(/^classifier: /i, 'Classifier: ').replace(/^(\w)/, m => m.toUpperCase()));
  let action;
  if (c) {
    const nd = c.actions.filter(x => x.done).length;
    action = `<div class="done-box"><div>${stagePill(st)} · <b>${c.id}</b> with ${esc(teamName(c.team))} · ${nd}/${c.actions.length} actions done · ${dueText(c).text}</div>
      <div><button type="button" class="btn btn-dark" data-act="open-case" data-id="${c.id}">Open in team workspace ›</button></div></div>`;
  } else {
    action = `<div class="hitl">
      <label for="pick-team" class="h" style="margin:0">Owner team</label>
      <select class="select" id="pick-team" data-field="pick-team" data-id="${a.id}">${V.TEAMS.map(t => `<option value="${t.id}"${t.id === pick ? ' selected' : ''}>${esc(t.name)}${t.id === a.team ? ' (suggested)' : ''}</option>`).join('')}</select>
      <button type="button" class="btn btn-primary" data-act="distribute" data-id="${a.id}">Confirm & send to team</button>
      <span class="note">${a.review ? 'Human in the loop: this alert is ' + a.tier + ', so a person confirms it before the team is notified.' : a.tier === 'Medium' ? 'Medium alerts sit on the watchlist; send one to a team only if it needs action now.' : 'Low alerts are logged for the scheduled reassessment.'}</span></div>`;
  }
  return `<article class="card" aria-labelledby="card-h">
    <div class="card-top"><div><div class="tl ${a.tier}">${a.tier.toUpperCase()}</div><h2 id="card-h">${esc(a.vendor)} · ${cat(a.category)}</h2>
      <div class="muted" style="font-size:12.5px;margin-top:4px">${esc(a.service)} · ${esc(a.country)} · ${a.id} · ${fd(a.date)} · ${provMark(a)}</div></div>${scoreBadge(a, true)}</div>
    <div class="owner-line"><span><b>Owner:</b> ${esc(teamName(c ? c.team : pick))}${a.tier === 'Critical' && (c ? c.team : pick) === 'sec' ? ' (Cyber Incident Response)' : ''}</span><span><b>Inform:</b> TPRM</span><span><b>Deadline:</b> ${tier.deadline}</span><span><b>Response:</b> ${esc(tier.response)}</span></div>
    ${action}
    <div class="quote">${esc(a.text)}</div>
    <div class="formula" aria-label="Score"><span>Likelihood</span><b>${a.likelihood.toFixed(1)}</b><span>×</span><span>Impact</span><b>${a.impact.toFixed(1)}</b><span>×</span><span>(1 − controls ${Math.round(a.controlReduction * 100)}%)</span><span class="eq">=</span><b>${a.residual.toFixed(1)}</b><span class="muted">/ 25 residual risk</span></div>
    <div class="cols">
      <div><div class="h">Why flagged</div><ul class="why">${why.map(w => `<li>${esc(w)}</li>`).join('')}</ul>
        <dl class="facts"><div><dt>Criticality</dt><dd>${a.criticality}/5</dd></div><div><dt>Data sensitivity</dt><dd>${a.dataSensitivity}/5</dd></div><div><dt>Substitutability</dt><dd>${a.substitutability}/5</dd></div></dl></div>
      <div><div class="h">Recommended actions</div><ul class="acts">${a.actions.map(x => `<li>${esc(x)}</li>`).join('')}</ul></div>
    </div>
    <div><div class="h">Evidence</div><table class="t ev"><tbody>${ev.map(e => `<tr><td>${fd(e.date)}</td><td>${e.url ? `<a href="${esc(e.url)}" target="_blank" rel="noopener noreferrer">${esc(e.sourceName)}</a>` : esc(src(e.sourceType))}</td><td>${esc(e.text)}</td></tr>`).join('')}
      ${pos.map(p => `<tr><td>${fd(p.date)}</td><td><span class="pos">Positive</span> ${esc(src(p.sourceType))}</td><td>${esc(p.text)}</td></tr>`).join('')}</tbody></table></div>
  </article>`;
}

function viewTeam() {
  const counts = id => S.cases.filter(c => c.team === id && !c.finishedAt).length;
  const t = V.TEAM_BY_ID[S.team];
  const mine = S.cases.filter(c => c.team === S.team);
  const cols = [['todo', 'To do', c => !c.finishedAt && !c.actions.some(x => x.done)], ['progress', 'In progress', c => !c.finishedAt && c.actions.some(x => x.done)], ['done', 'Finished', c => c.finishedAt]];
  const card = c => {
    const a = BY_ID.get(c.alertId); const nd = c.actions.filter(x => x.done).length; const du = dueText(c);
    return `<button type="button" class="tc" data-act="open-case" data-id="${c.id}"><span class="top"><span class="id">${c.id}</span>${tierMark(a.tier)}</span>
      <span class="v">${esc(a.vendor)}</span><span class="p">${esc(a.playbook)}</span>
      <span class="prog${nd === c.actions.length ? ' full' : ''}"><span class="tr"><i style="width:${(nd / c.actions.length) * 100}%"></i></span><span>${nd}/${c.actions.length}</span></span>
      <span class="due${du.over ? ' over' : ''}">${du.text}</span></button>`;
  };
  return `
  <div class="title"><div><div class="kicker">Team workspace</div><h1>${esc(t.name)}</h1><p>${esc(t.unit)}. Work through the actions on each alert, then mark it finished.</p></div></div>
  <div class="teams" role="group" aria-label="Team">${V.TEAMS.map(x => `<button type="button" data-act="team" data-team="${x.id}" aria-pressed="${x.id === S.team}">${esc(x.name)} <span class="count">${counts(x.id)}</span></button>`).join('')}</div>
  <div class="board">${cols.map(([k, l, f]) => { const list = mine.filter(f); return `<section class="col"><h2>${l} <span>${list.length}</span></h2><div class="col-body">${
    list.length ? list.map(card).join('') : `<div class="col-empty">${k === 'todo' ? (mine.length ? 'Nothing waiting.' : 'No alerts sent to this team yet.') : k === 'progress' ? 'Tick an action to start.' : 'Nothing finished yet.'}</div>`}</div></section>`; }).join('')}</div>`;
}

function drawer() {
  const c = S.cases.find(x => x.id === S.caseId); if (!c) return '';
  const a = BY_ID.get(c.alertId); const nd = c.actions.filter(x => x.done).length; const all = nd === c.actions.length; const du = dueText(c);
  return `<div class="backdrop" data-act="close-case"></div>
  <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="dr-h">
    <button type="button" class="btn btn-ghost btn-sm x" data-act="close-case">Close ✕</button>
    <div class="card-top"><div><div class="tl ${a.tier}" style="color:${a.tier === 'Critical' ? 'var(--red)' : 'inherit'};font-weight:700;font-size:13px">${a.tier.toUpperCase()} · ${c.id}</div>
      <h2 id="dr-h" style="font-size:22px">${esc(a.vendor)} · ${cat(a.category)}</h2><div class="muted" style="font-size:12.5px">${esc(a.playbook)}</div></div>${scoreBadge(a, true)}</div>
    <div class="owner-line"><span><b>Owner:</b> ${esc(teamName(c.team))}</span><span><b>Inform:</b> TPRM</span><span class="due${du.over ? ' over' : ''}"><b>Deadline:</b> ${du.text}</span></div>
    <div class="quote">${esc(a.text)}</div>
    <div><div class="label">Actions <small>${nd} of ${c.actions.length} done</small></div>
      <ul class="checks">${c.actions.map((x, i) => `<li><label class="${x.done ? 'ok' : ''}"><input type="checkbox" data-act="tick" data-idx="${i}" ${x.done ? 'checked' : ''} ${c.finishedAt ? 'disabled' : ''}><span><span class="ct">${esc(x.text)}</span>${x.done ? `<span class="cm">Done ${fmtTime.format(x.at)}</span>` : ''}</span></label></li>`).join('')}</ul>
      ${c.finishedAt ? '' : `<div class="addrow" style="margin-top:8px"><input class="input" id="new-action" data-field="new-action" placeholder="Add an action…" value="${esc(S.newAction)}"><button type="button" class="btn" data-act="add-action">Add</button></div>`}</div>
    <div>${c.finishedAt ? `<div class="done-box"><div>${stagePill('done')} · ${esc(c.outcome)}</div><div><button type="button" class="btn btn-sm" data-act="reopen">Reopen</button></div></div>` :
      `<div class="hitl" style="border:0;padding:0"><select class="select" id="outcome" aria-label="Outcome"><option>Remediated by vendor</option><option>Risk accepted</option><option>No impact on the bank</option><option>Escalated to exit plan</option></select>
       <button type="button" class="btn btn-primary" data-act="finish" ${all ? '' : 'disabled'}>Mark finished</button>${all ? '' : `<span class="note">Tick the remaining ${c.actions.length - nd} action${c.actions.length - nd === 1 ? '' : 's'} to finish.</span>`}</div>`}</div>
    <div><div class="label">Activity</div><ul class="log">${[...c.log].reverse().map(l => `<li><time>${fmtStamp.format(l.at)}</time>${esc(l.text)}</li>`).join('')}</ul></div>
  </aside>`;
}

function renderToast() {
  const t = S.toast;
  $('#toast-root').innerHTML = t ? `<div class="toast" role="status"><span>${esc(t.msg)}</span>${t.act ? `<button type="button" data-act="${t.act}" data-id="${esc(t.id || '')}">${esc(t.label)}</button>` : ''}</div>` : '';
}

// ===== Render & events =====
let toastTimer = 0;
function toast(msg, act, label, id) {
  S.toast = { msg, act, label, id }; renderToast();
  clearTimeout(toastTimer); toastTimer = setTimeout(() => { S.toast = null; renderToast(); }, 6000);
}
function render() {
  const q = document.getElementById('qlist'); const qTop = q ? q.scrollTop : 0;
  const d = document.querySelector('.drawer'); const dTop = d ? d.scrollTop : 0;
  renderNav();
  $('#main').innerHTML = S.view === 'queue' ? viewQueue() : S.view === 'team' ? viewTeam() : viewDashboard();
  $('#overlay').innerHTML = S.view === 'team' ? drawer() : '';
  document.body.style.overflow = S.view === 'team' && S.caseId ? 'hidden' : '';
  const q2 = document.getElementById('qlist'); if (q2) q2.scrollTop = qTop;
  const d2 = document.querySelector('.drawer'); if (d2) d2.scrollTop = dTop;
  renderToast();
}
function go(view) { S.view = view; S.caseId = S.view === 'team' ? S.caseId : null; render(); window.scrollTo(0, 0); }
function openCase(id) {
  const c = S.cases.find(x => x.id === id); if (!c) return;
  S.team = c.team; S.caseId = id; S.newAction = ''; go('team');
}

const ACTS = {
  nav: el => go(el.dataset.view),
  'open-alert': el => {
    const a = BY_ID.get(el.dataset.id); if (!a) return;
    S.sel = a.id;
    if (stageOf(a) !== 'review') S.scope = 'all';
    go('queue');
    const row = document.querySelector(`.arow.sel`); if (row) row.scrollIntoView({ block: 'nearest' });
  },
  scope: el => { S.scope = el.dataset.scope; S.sel = null; render(); },
  distribute: el => {
    const a = BY_ID.get(el.dataset.id); if (!a || S.byAlert.get(a.id)) return;
    const before = ALERTS.filter(x => S.scope === 'all' || stageOf(x) === 'review').map(x => x.id);
    const c = distribute(a, S.teamPick[a.id] || a.team);
    if (S.scope === 'review') {
      const i = before.indexOf(a.id); const rest = before.filter(id => id !== a.id);
      S.sel = rest[Math.min(i, rest.length - 1)] || null;
    }
    render();
    toast(`${c.id} sent to ${teamName(c.team)} · ${plural(c.actions.length, 'action')} · deadline ${V.TIER_BY_ID[a.tier].deadline}`, 'open-case', 'View in team workspace', c.id);
  },
  team: el => { S.team = el.dataset.team; S.caseId = null; render(); },
  'open-case': el => openCase(el.dataset.id),
  'close-case': () => { S.caseId = null; render(); },
  'add-action': () => {
    const c = S.cases.find(x => x.id === S.caseId); const t = S.newAction.trim(); if (!c || !t) return;
    c.actions.push({ text: t, done: false, at: 0 }); c.log.push({ at: Date.now(), text: 'Added action: ' + t }); S.newAction = ''; render();
    const inp = document.getElementById('new-action'); if (inp) inp.focus();
  },
  finish: () => {
    const c = S.cases.find(x => x.id === S.caseId); if (!c) return;
    finishCase(c, ($('#outcome') || {}).value || 'Remediated by vendor');
    S.caseId = null; render();
    toast(`${c.id} finished · ${c.outcome}`, 'go-dash', 'Back to dashboard');
  },
  'go-dash': () => go('dashboard'),
  reopen: () => { const c = S.cases.find(x => x.id === S.caseId); if (!c) return; c.finishedAt = 0; c.log.push({ at: Date.now(), text: 'Reopened' }); render(); },
  run: () => {
    if (S.run === 'running') return;
    const t0 = Date.now(); S.run = 'running'; S.runStep = 0; render();
    const next = () => {
      S.runStep += 1;
      if (S.runStep >= 6) {
        S.run = 'done'; S.lastRun = Date.now(); S.runMs = S.lastRun - t0; render();
        const n = ALERTS.filter(a => stageOf(a) === 'review').length;
        toast(`Scan complete · ${ALERTS.length} risk signals scored · ${n} alerts need review`, 'nav-queue', 'Open review queue');
        return;
      }
      if (S.view === 'dashboard') render(); else renderNav();
      setTimeout(next, 650 + Math.random() * 350);
    };
    setTimeout(next, 700);
  },
  'run-from-queue': () => { go('dashboard'); ACTS.run(); },
  'nav-queue': () => go('queue'),
  reset: () => { resetDemo(); S.view = 'dashboard'; render(); toast('Demo reset — all alerts are back in the queue'); }
};

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]'); if (!el || el.matches('input[type="checkbox"]')) return;
  const f = ACTS[el.dataset.act]; if (f) { e.preventDefault(); f(el, e); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.act === 'tick') {
    const c = S.cases.find(x => x.id === S.caseId); if (!c) return;
    toggleAction(c, +el.dataset.idx); render();
    const all = c.actions.every(x => x.done);
    if (all) toast('All actions done — choose an outcome and mark it finished');
  } else if (el.dataset.field === 'pick-team') { S.teamPick[el.dataset.id] = el.value; render(); }
});
document.addEventListener('input', e => { if (e.target.dataset.field === 'new-action') S.newAction = e.target.value; });
document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && S.caseId) { S.caseId = null; render(); }
  if (e.key === 'Enter' && e.target.id === 'new-action') { e.preventDefault(); ACTS['add-action'](); }
});

// tooltips for the routing bars
const tip = document.createElement('div'); tip.className = 'tip'; tip.hidden = true; document.body.appendChild(tip);
document.addEventListener('pointermove', e => {
  const t = e.target.closest && e.target.closest('[data-tip]');
  if (!t) { tip.hidden = true; return; }
  tip.textContent = t.dataset.tip; tip.hidden = false;
  tip.style.left = Math.min(e.clientX + 12, window.innerWidth - tip.offsetWidth - 8) + 'px'; tip.style.top = (e.clientY + 14) + 'px';
});

render();

})();
</script>
</body>
</html>
